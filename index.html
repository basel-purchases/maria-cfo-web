<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#68465e" />
  <meta name="description" content="Maria CFO - الإدارة المالية الذكية للمطعم" />
  <title>Maria CFO</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="./assets/styles.css?v=1.0.5" />
</head>
<body>
  <div id="app"></div>
  <!-- Fail-safe: show an actionable startup error instead of a silent blank screen. -->
  <script>
    (() => {
      let startupError = '';
      const showStartupError = () => {
        const root = document.getElementById('app');
        if (!root || root.children.length || root.textContent.trim()) return;
        root.innerHTML = `
          <main dir="rtl" style="max-width:600px;margin:12vh auto;padding:26px;font:16px/1.9 system-ui,Tahoma,sans-serif;color:#392b36">
            <section style="border:1px solid #e9dde5;border-radius:16px;background:white;padding:26px;box-shadow:0 5px 22px #2314220d">
              <h1 style="font-size:22px;margin:0 0 8px">تعذّر تشغيل Maria CFO</h1>
              <p>لم تكتمل عملية تحميل البرنامج. يُرجى إعادة تحميل الصفحة، ثم التحقق من رفع جميع ملفات الإصدار وتحديث ذاكرة المتصفح.</p>
              <p id="maria-startup-details" style="font-size:12px;overflow-wrap:anywhere;color:#715d6c"></p>
              <button type="button" id="maria-startup-retry" style="background:#68465e;color:white;border:0;padding:11px 20px;border-radius:9px;cursor:pointer">إعادة المحاولة</button>
              <p style="font-size:12px;color:#7a6876">Web v1.0.5 — لا يؤثر إعادة التحميل على قاعدة البيانات.</p>
            </section>
          </main>`;
        const detail = document.getElementById('maria-startup-details');
        if (detail && startupError) detail.textContent = startupError.slice(0, 220);
        document.getElementById('maria-startup-retry')?.addEventListener('click', () => location.reload());
      };
      window.addEventListener('error', event => {
        if (event.target && event.target !== window && event.target.tagName !== 'SCRIPT') return;
        startupError = String(event.message || 'تعذر تحميل ملف JavaScript');
        window.setTimeout(showStartupError, 1500);
      }, true);
      window.addEventListener('unhandledrejection', event => {
        startupError = String(event.reason?.message || event.reason || 'تعذر بدء البرنامج');
        window.setTimeout(showStartupError, 1500);
      });
      window.setTimeout(showStartupError, 12000);
    })();
  </script>
  <script src="./config.js"></script>
  <script src="./vendor/jszip.min.js"></script>
  <script type="module" src="./js/app.js?v=1.0.5"></script>
</body>
</html>
